[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-bench-rl"
version = "0.1.0"
description = "A lightweight RL environment for benchmarking LLMs on ELT data engineering tasks."
authors = [
    { name = "Rohit Sircar" }
]
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]